name: Bug report
description: Report a reproducible console or control-runtime defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not reproduce unsafe motion for a report. Use a private security advisory for safety-critical vulnerabilities."
  - type: input
    id: firmware
    attributes:
      label: NERO firmware and hardware
      placeholder: "NERO v120, AGX gripper, CANDO, Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove device serial numbers, credentials, paths, and personal data.
