[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-can-agx-cando"
version = "0.0.1"
description = "AgileX CANDO backend for python-can"
requires-python = ">=3.10"
dependencies = ["python-can>=4.6"]

[project.entry-points."can.interface"]
agx_cando = "agx_cando.bus:AgxCandoBus"

[tool.setuptools]
packages = ["agx_cando"]
include-package-data = true

[tool.setuptools.package-data]
agx_cando = ["bin/x32/cando.dll", "bin/x64/cando.dll"]
